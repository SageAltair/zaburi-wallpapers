name: Publish uploaded wallpapers
on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'tooling/sync_uploaded_images.py'
      - '.github/workflows/publish-uploaded-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add uploaded images to catalog
        run: python tooling/sync_uploaded_images.py
      - name: Commit updated catalog
        run: |
          if ! git diff --quiet -- wallpapers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wallpapers.json
            git commit -m "Update catalog for browser uploads"
            git push
          fi
